<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KrishiSetu - Your Smart Farming Companion</title>

  <meta name="description" content="Empowering farmers with smart agricultural insights" />
  <meta name="author" content="KrishiSetu" />

  <style>
    .goog-te-banner-frame.skiptranslate {
      display: none !important;
    }
    body {
      top: 0 !important;
    }
  </style>
</head>

<body>
  <!-- Hidden Google Translate Element -->
  <div id="google_translate_element" style="display:none;"></div>

  <!-- React Mount -->
  <div id="root"></div>

  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',
          includedLanguages: 'en,mr',
          autoDisplay: false
        },
        'google_translate_element'
      );
    }

    // Expose globally for React
    window.setAppLanguage = function (lang) {
      const select = document.querySelector('.goog-te-combo');
      if (!select) {
        alert("Language system loading… please try again.");
        return;
      }
      select.value = lang;
      select.dispatchEvent(new Event('change'));
    };
  </script>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
